<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK SECOND EXAM</title>
  
  <!-- Firebase SDK (Google-এর ফ্রি ডাটাবেজ) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .quiz-card { background: var(--card-bg); width: 100%; max-width: 650px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); padding: 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border-color); }
    .progress-text { font-size: 14px; font-weight: 600; color: var(--primary-color); background: rgba(79, 70, 229, 0.1); padding: 6px 14px; border-radius: 20px; }
    .progress-bar-container { width: 100%; height: 8px; background-color: var(--border-color); border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
    .progress-bar { height: 100%; background-color: var(--primary-color); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 20px; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { width: 100%; padding: 14px 18px; font-size: 16px; text-align: left; background: transparent; color: var(--text-main); border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary-color); background-color: rgba(79, 70, 229, 0.05); }
    .option-btn.correct { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: var(--correct-text) !important; font-weight: 600; }
    .option-btn.wrong { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: var(--wrong-text) !important; font-weight: 600; }
    .footer-actions { margin-top: 28px; display: flex; justify-content: flex-end; }
    .next-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 28px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; display: none; }
    
    .user-info-screen, .result-screen { text-align: center; display: none; }
    .user-info-screen input { width: 100%; padding: 12px; font-size: 16px; margin: 15px 0; border: 2px solid var(--border-color); border-radius: 8px; }
    .start-btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    
    .score-circle { width: 150px; height: 150px; border-radius: 50%; background: rgba(79, 70, 229, 0.1); color: var(--primary-color); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px auto; font-size: 36px; font-weight: 800; }
    .score-details { display: flex; justify-content: space-around; margin: 20px 0; background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <div class="quiz-card">
    
    <!-- ১. পরীক্ষার্থীর নাম দেওয়ার স্ক্রিন -->
    <div id="user-info-view" class="user-info-screen" style="display: block;">
      <h2>Let's start now</h2>
      <p style="color: var(--text-muted); margin-top: 5px;">Enter your name</p>
      <input type="text" id="user-name" placeholder="Enter your name...">
      <button class="start-btn" onclick="startQuiz()">Start now</button>
    </div>

    <!-- ২. মূল কুইজ স্ক্রিন -->
    <div id="quiz-view" style="display: none;">
      <div class="top-bar">
        <h2 id="display-name" style="font-size: 16px;"></h2>
        <span class="progress-text" id="progress-text">Question 1/40</span>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-title">QUESTION LOADING...</div>

      <div class="options-grid" id="options-grid"></div>

      <div class="footer-actions">
        <button class="next-btn" id="next-btn" onclick="handleNextQuestion()">NEXT QUESTION ➔</button>
      </div>
    </div>

    <!-- ৩. রেজাল্ট স্ক্রিন -->
    <div class="result-screen" id="result-view">
      <h2>Exam finish!</h2>
      <p style="color: var(--text-muted)">tumar folafol joma hoise pakhi</p>
      
      <div class="score-circle">
        <div id="final-score">০.০০</div>
        <span style="font-size: 14px; color: var(--text-muted);">Total score / 40</span>
      </div>

      <div class="score-details">
        <div><strong style="color: var(--correct-border); font-size: 20px;" id="correct-count">০</strong><br><small>সঠিক (+1.00)</small></div>
        <div><strong style="color: var(--wrong-border); font-size: 20px;" id="wrong-count">০</strong><br><small>ভুল (-0.25)</small></div>
      </div>
    </div>

  </div>

  <script>

    // ৪০টি প্রশ্ন এবং সঠিক উত্তরের ইনডেক্স (0 থেকে শুরু)
    const questionsDatabase = [
      { question: "1. . বাংলার প্রাচীনতম জনপদগুলোর মধ্যে অন্যতম পুণ্ড্রবর্ধনের রাজধানী কোথায় ছিল?", options: [" ময়নামতি", "মহাস্থানগড়", "পাহাড়পুর", "উয়ারী-বটেশ্বর"], correct: 1 },
      { question: "2. ২০২৬ সালের নির্বাচনে বিএনপির চেয়ারম্যান তারেক রহমান কোন দুটি আসনে নির্বাচিত হন?", options: [" ঢাকা-১৭ ও বগুড়া-৬", " ঢাকা-১০ ও বগুড়া-৭", "গোপালগঞ্জ-৩ ও ঢাকা-১৭", "চট্টগ্রাম-৯ ও বগুড়া-৬"], correct: 0 },
      { question: "3. বাংলায় স্বাধীন সুলতানি শাসনের প্রতিষ্ঠাতা হিসেবে কাকে গণ্য করা হয়?", options: ["শামসুদ্দিন ইলিয়াস শাহ ", "আলাউদ্দিন হোসেন শাহ", "শশাঙ্ক", "গিয়াসউদ্দিন আজম শাহ"], correct: 0 },

      { question: "5. বাংলাদেশের তৈরি পোশাকশিল্পের আন্তর্জাতিক বাণিজ্যের সঙ্গে সবচেয়ে বেশি সম্পর্কিত কোনটি?", options: [" RMG শিল্প", "মহাকাশ গবেষণা", "পারমাণবিক বিদ্যুৎ উৎপাদন", "সামুদ্রিক পর্যটন"], correct: 0 },
      { question: "6.লাহোর প্রস্তাব উত্থাপন করেন কে?", options: ["হোসেন শহীদ সোহরাওয়ার্দী", "এ কে ফজলুল হক", "খাজা নাজিমুদ্দিন", "মোহাম্মদ আলী জিন্নাহ"], correct: 1 },
      { question: "7. চিরস্থায়ী বন্দোবস্ত প্রবর্তন করেন কে?", options: ["লর্ড কার্জন", "লর্ড ওয়েলেসলি", "লর্ড কর্নওয়ালিস", "লর্ড ডালহৌসি "], correct: 2 },

      { question: "14. ফরাসি বিপ্লবের প্রতীকী সূচনাবিন্দু হিসেবে কোন ঘটনাটি পরিচিত?", options: ["ওয়াটারলুর যুদ্ধ", "বাস্তিল দুর্গের পতন", "ভার্সাই চুক্তি", "নেপোলিয়নের অভিষেক"], correct: 1 },
      { question: "15. ভিয়েনা কংগ্রেস অনুষ্ঠিত হয়েছিল কোন সময়কালে?", options: ["১৭৮৯–১৭৯১", "১৮০৪–১৮০৭", "১৮১৪–১৮১৫", " ১৮৪৮–১৮৪৯" ], correct: 2 },

    let userName = "";
    let currentQuestionIndex = 0;
    let totalScore = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let userWrongQuestions = []; 

    function startQuiz() {
      const nameInput = document.getElementById('user-name').value.trim();
      if(nameInput === "") {
        alert("Please enter your name!");
        return;
      }
      userName = nameInput;
      document.getElementById('display-name').innerText = `শিক্ষার্থী: ${userName}`;
      document.getElementById('user-info-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      const currentData = questionsDatabase[currentQuestionIndex];
      document.getElementById('next-btn').style.display = 'none';
      const optionsGrid = document.getElementById('options-grid');
      optionsGrid.innerHTML = '';

      document.getElementById('progress-text').innerText = `প্রশ্ন ${currentQuestionIndex + 1}/${questionsDatabase.length}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / questionsDatabase.length) * 100}%`;
      document.getElementById('question-title').innerText = currentData.question;

      currentData.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.innerText = option;
        button.onclick = () => selectOption(index, button);
        optionsGrid.appendChild(button);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      const currentData = questionsDatabase[currentQuestionIndex];
      const allButtons = document.querySelectorAll('.option-btn');
      allButtons.forEach(btn => btn.disabled = true);

      if (selectedIndex === currentData.correct) {
        selectedBtn.classList.add('correct');
        totalScore += 1;
        correctCount++;
      } else {
        selectedBtn.classList.add('wrong');
        allButtons[currentData.correct].classList.add('correct');
        totalScore -= 0.25;
        wrongCount++;
        
        userWrongQuestions.push({
          question: currentData.question,
          selectedAnswer: currentData.options[selectedIndex],
          correctAnswer: currentData.options[currentData.correct]
        });
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    function handleNextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsDatabase.length) {
        loadQuestion();
      } else {
        submitResultsToDatabase();
      }
    }

    function submitResultsToDatabase() {
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      document.getElementById('final-score').innerText = totalScore.toFixed(2);
      document.getElementById('correct-count').innerText = correctCount;
      document.getElementById('wrong-count').innerText = wrongCount;

      db.collection("quiz_results 2").add({
        name: userName,
        score: totalScore.toFixed(2),
        correct: correctCount,
        wrong: wrongCount,
        wrongQuestions: userWrongQuestions,
        time: new Date()
      })
      .then(() => {
        console.log("ফলাফল সফলভাবে জমা হয়েছে!");
      })
      .catch((error) => {
        console.error("ডাটা সেভ করতে সমস্যা হয়েছে: ", error);
      });
    }
  </script>
